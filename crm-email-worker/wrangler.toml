name = "crm-email-worker"
main = "src/index.js"
compatibility_date = "2026-08-15"

# Environment Variables
[vars]
DEFAULT_CRM_ACCOUNT_ID = "acc_primary_org"
LOG_LEVEL = "info"

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "obsidiandashoarddb"
database_id = "adc1da90-6d37-45e1-88ce-9522ea7bf3ee"
migrations_dir = "./migrations"

# Cloudflare R2 Bucket Binding (Attachments & Raw EMLs)
[[r2_buckets]]
binding = "CRM_BUCKET"
bucket_name = "obsidiancrm"
