# Protected API Worker (example: GET /api/v1/health). Secrets are NOT stored here:
#   npx wrangler secret put MASTER_API_KEY -c wrangler.api.toml
name = "obsidian-crm-api"
main = "src/workers/healthApi.ts"
compatibility_date = "2024-09-23"

[vars]
# Browser origins allowed to call this API (comma-separated). Leave empty for server-to-server only.
ALLOWED_ORIGINS = ""
